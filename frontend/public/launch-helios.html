<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Launching HELIOS</title>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
:root{--bg:#02040a;--fg:#f3f6fb;--mut:#9fb0c8;--ac:#4aa3ff;--fl:#ff8a2a;box-sizing:border-box;color-scheme:dark;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root{--bg:#02040a}}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font-family:'Rajdhani',system-ui,sans-serif;overflow:hidden}
#root,.app{height:100%;position:relative}
.cv{position:absolute;inset:0}.cv canvas{display:block;width:100%;height:100%}
header{position:absolute;top:0;left:0;right:0;padding:calc(14px + env(safe-area-inset-top,0px)) 20px 0;display:flex;gap:14px;align-items:baseline;letter-spacing:.3em;font-size:14px;pointer-events:none;text-shadow:0 1px 8px #000}
header b{font-size:20px;letter-spacing:.45em}header span{color:var(--mut);font-size:12px}
.hero{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;padding:0 7vw;max-width:640px;background:linear-gradient(90deg,#02040acc,transparent)}
.k{color:var(--ac);letter-spacing:.35em;text-transform:uppercase;font-size:13px;margin:0}
h1{font-size:clamp(40px,8vw,88px);line-height:.95;margin:10px 0 14px;font-weight:700;text-transform:uppercase}
.hero p:not(.k){color:var(--mut);font-size:18px;max-width:420px;margin:0 0 26px}
button{font:700 16px 'Rajdhani',sans-serif;letter-spacing:.2em;text-transform:uppercase;color:#fff;background:linear-gradient(135deg,#0a5fb8,#2b8cff);border:0;padding:15px 28px;border-radius:2px;cursor:pointer;align-self:flex-start;box-shadow:0 0 30px #2b8cff55}
button:disabled{opacity:.5;cursor:wait}button:hover:not(:disabled){filter:brightness(1.15)}
.hud{position:absolute;inset:0;pointer-events:none;text-shadow:0 1px 10px #000}
.clk{position:absolute;top:64px;left:0;right:0;text-align:center;font-size:clamp(34px,6vw,60px);font-weight:700;letter-spacing:.12em}
.msg{position:absolute;top:calc(64px + clamp(40px,7vw,70px));left:0;right:0;text-align:center;color:var(--fl);letter-spacing:.3em;text-transform:uppercase;font-size:15px}
.tel{position:absolute;bottom:calc(22px + env(safe-area-inset-bottom,0px));left:0;right:0;display:flex;justify-content:center;gap:clamp(24px,8vw,90px)}
.tel div{text-align:center}.tel small{display:block;color:var(--mut);letter-spacing:.3em;font-size:11px}.tel b{font-size:clamp(24px,4vw,38px);font-variant-numeric:tabular-nums}
.end{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;pointer-events:none}
.end h2{margin:0;font-size:clamp(32px,6vw,64px);letter-spacing:.2em;text-transform:uppercase;text-shadow:0 2px 20px #000}.end button{pointer-events:auto;align-self:center}

.gl{background:linear-gradient(180deg,rgba(8,18,40,.62),rgba(4,10,24,.5));border:1px solid rgba(130,175,255,.3);backdrop-filter:blur(8px);padding:10px 14px;text-shadow:none}
.p{position:absolute;border-left:3px solid #fc3d21}
.gl small{display:block;font:11px 'Share Tech Mono',monospace;letter-spacing:.28em;color:#8fb2e8;margin-bottom:2px}
.mt{top:calc(16px + env(safe-area-inset-top,0px));left:16px}.mt b{font:400 clamp(24px,4.5vw,40px) 'Share Tech Mono',monospace;letter-spacing:.06em}
.ev{top:calc(16px + env(safe-area-inset-top,0px));right:16px;text-align:right;border-left:1px solid rgba(130,175,255,.3);border-right:3px solid #0b6bff;min-width:140px}
.ev b{font:700 clamp(14px,2.6vw,22px) 'Rajdhani',sans-serif;letter-spacing:.2em;text-transform:uppercase}
.cells{position:absolute;left:16px;right:16px;bottom:calc(84px + env(safe-area-inset-bottom,0px));display:flex;gap:10px;justify-content:center}
.cell{flex:1;max-width:270px}.cell b{font:400 clamp(20px,4vw,32px) 'Share Tech Mono',monospace}.cell i{font:normal 12px 'Share Tech Mono',monospace;color:#8fb2e8;margin-left:6px}
.bar{height:3px;background:rgba(130,175,255,.2);margin-top:8px}.bar span{display:block;height:100%;background:linear-gradient(90deg,#0b6bff,#7fd0ff)}
.tln{position:absolute;left:16px;right:16px;bottom:calc(18px + env(safe-area-inset-bottom,0px));display:flex}
.nd{flex:1;text-align:center;font:10px 'Share Tech Mono',monospace;color:#6f8bb8;position:relative;padding-top:18px;letter-spacing:.04em;text-shadow:0 1px 6px #000}
.nd:before{content:'';position:absolute;top:2px;left:50%;width:9px;height:9px;margin-left:-5px;border-radius:50%;border:1px solid #6f8bb8;background:#04101f;z-index:1}
.nd:after{content:'';position:absolute;top:6px;left:-50%;right:50%;height:1px;background:#33507f}.nd:first-child:after{display:none}
.nd.on{color:#fff}.nd.on:before{background:#fc3d21;border-color:#fc3d21;box-shadow:0 0 10px #fc3d21}.nd.on:after{background:#fc3d21}
.load{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font:14px 'Share Tech Mono',monospace;letter-spacing:.4em;color:#8fb2e8;background:#02040a}
.fade{position:absolute;inset:0;background:#000;pointer-events:none}
.endc{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;padding:0 20px}
.endc b{font:700 clamp(24px,5vw,52px) 'Rajdhani',sans-serif;letter-spacing:.3em}.endc span{font:12px 'Share Tech Mono',monospace;letter-spacing:.3em;color:#8fb2e8}
.ttl{position:absolute;left:0;right:0;bottom:7vh;text-align:center;font:600 clamp(16px,2.6vw,28px) 'Rajdhani',sans-serif;letter-spacing:.6em;text-indent:.6em;text-transform:uppercase;text-shadow:0 2px 14px #000;pointer-events:none;animation:fi 2s ease both}@keyframes fi{from{opacity:0}to{opacity:.92}}
.fx{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.28) 100%)}.gr{position:absolute;inset:-50%;pointer-events:none;opacity:.07;mix-blend-mode:overlay;animation:gr .6s steps(6) infinite}@keyframes gr{to{transform:translate(8%,6%)}}
.fx{background:radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.3) 100%)}.lb{position:absolute;left:0;right:0;height:6.5vh;background:#000;pointer-events:none}.fd{position:absolute;inset:0;background:#000;pointer-events:none;animation:fo 3s ease forwards}@keyframes fo{to{opacity:0;visibility:hidden}}
.snd{position:absolute;z-index:5;right:2.2vw;bottom:calc(6.5vh + 14px);width:36px;height:36px;border:1px solid rgba(255,255,255,.4);border-radius:50%;background:rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;cursor:pointer;opacity:.8}.snd.p{animation:pl 1.4s infinite}@keyframes pl{50%{box-shadow:0 0 0 9px rgba(255,255,255,.14)}}
.wt{position:absolute;z-index:5;left:50%;top:50%;width:62px;height:62px;margin:-31px 0 0 -31px;border:2px solid rgba(255,255,255,.75);border-radius:50%;pointer-events:none;animation:pl 1.5s infinite}.wt:after{content:'';position:absolute;left:24px;top:18px;border-left:18px solid rgba(255,255,255,.85);border-top:12px solid transparent;border-bottom:12px solid transparent}
</style></head><body><div id="root"></div>
